name: Set up rb
description: Install rb and rb-helper from a rootbeer commit, verified against the attestation rootbeer's CI made for them.
inputs:
  revision-file:
    description: File holding the full rootbeer commit SHA to install
    default: .github/rb-engine-revision
runs:
  using: composite
  steps:
    - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
    - name: Install attested rb
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REVISION_FILE: ${{ inputs.revision-file }}
      run: |
        revision=$(cat "$REVISION_FILE")
        if ! [[ "$revision" =~ ^[0-9a-f]{40}$ ]]; then
          echo 'The rb revision must be a full lowercase commit SHA.' >&2
          exit 1
        fi
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) target=x86_64-unknown-linux-gnu ;;
          Linux-ARM64) target=aarch64-unknown-linux-gnu ;;
          macOS-ARM64) target=aarch64-apple-darwin ;;
          *) echo "No rb is published for $RUNNER_OS $RUNNER_ARCH" >&2; exit 1 ;;
        esac
        directory="$RUNNER_TEMP/rb"
        mkdir -p "$directory/bin"
        oras pull "ghcr.io/rootbeer-org/rb:$revision-$target" --output "$directory"
        for binary in rb rb-helper; do
          gh attestation verify "$directory/$binary-$target" --repo rootbeer-org/rootbeer \
            --signer-workflow rootbeer-org/rootbeer/.github/workflows/build.yml \
            --source-ref refs/heads/main --source-digest "$revision" --deny-self-hosted-runners
          install -m 0755 "$directory/$binary-$target" "$directory/bin/$binary"
        done
        echo "$directory/bin" >> "$GITHUB_PATH"
